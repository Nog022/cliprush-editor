appId: studio.cliprush.editor
productName: ClipRush Editor Studio
electronDist: node_modules/electron/dist
directories:
  app: dist
  output: out/desktop-release
files:
  - "!**/.env*"
  - "!**/*credentials*"
  - desktop/**
  - ui/**
  - package.json
extraResources:
  - from: desktop/models
    to: desktop/models
  - from: scripts/analyze-segment.py
    to: scripts/analyze-segment.py
  - from: scripts/transcribe-narration.py
    to: scripts/transcribe-narration.py
  - from: scripts/buscar_cenas_gta6.py
    to: scripts/buscar_cenas_gta6.py
  - from: dist/render
    to: render
    filter:
      - "**/*"
      - "!public/**/*"
  - from: public/videos
    to: legacy-public/videos
    filter:
      - "**/*"
asar: true
asarUnpack:
  - node_modules/@remotion/compositor-*/**
win:
  target: dir
  signAndEditExecutable: false
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
